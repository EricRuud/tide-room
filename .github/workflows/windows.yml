name: Windows x64 preview
on:
  workflow_dispatch:
  push:
    branches: [main, windows-preview]
    paths: ['CMakeLists.txt', 'native/**', '.github/workflows/windows.yml']
  pull_request:
    paths: ['CMakeLists.txt', 'native/**', '.github/workflows/windows.yml']
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build, check, and package
        shell: pwsh
        run: ./native/build-room.ps1 -RunChecks
      - name: Upload Windows preview
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Tide-Room-Windows-x64-preview
          path: build-windows/Tide-Room-Windows-x64-preview.zip
          if-no-files-found: error
      - name: Upload check results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Windows-check-results
          path: build-windows/checks
          if-no-files-found: warn
